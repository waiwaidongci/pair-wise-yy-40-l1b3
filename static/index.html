<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日升级队列 · 建筑抗震鉴定与加固排序</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem;color:#17212b}table{border-collapse:collapse;width:100%;margin-top:1rem}th,td{border:1px solid #d5dde3;padding:.4rem .6rem;text-align:left;font-size:.9rem}th{background:#f4f7f9}tr.escalated{background:#fde8e8}button{padding:.55rem 1rem}pre{background:#f4f7f9;padding:1rem;overflow:auto}</style></head><body><h1>今日升级队列</h1><p>依据结构、用途、人员密度和历史缺陷生成鉴定与加固优先级</p><p>按风险分、人员密度和未关闭事项数量排分，分高靠前，同分按登记顺序；超过处置时限的项目进入升级并标注已超时小时数，办结后自动移出队列。</p><button onclick="loadQueue()">刷新队列</button><table id="queue"><thead><tr><th>名次</th><th>项目</th><th>风险等级</th><th>分数</th><th>未关闭事项</th><th>状态</th><th>升级</th><th>已超时(小时)</th><th>剩余时限(小时)</th></tr></thead><tbody></tbody></table><pre id="out"></pre><script>function cell(tr,text){const td=document.createElement('td');td.textContent=text;tr.appendChild(td)}
async function loadQueue(){const r=await fetch('/api/queue',{headers:{'X-Actor':'demo','X-Role':'viewer'}});const data=await r.json();const tbody=document.querySelector('#queue tbody');tbody.innerHTML='';for(const e of data.queue||[]){const tr=document.createElement('tr');if(e.escalated)tr.className='escalated';cell(tr,e.rank);cell(tr,e.title);cell(tr,e.severity);cell(tr,e.score);cell(tr,e.open_records);cell(tr,e.status);cell(tr,e.escalated?'已升级':'—');cell(tr,e.overdue_hours);cell(tr,e.remaining_hours);tbody.appendChild(tr)}document.getElementById('out').textContent=''}
loadQueue();</script></body></html>
